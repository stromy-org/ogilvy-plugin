# yaml-language-server: $schema=https://raw.githubusercontent.com/stromy-org/stromy-org/main/scripts/plugin-package.schema.json
# CANONICAL plugin package (ORG-PLAN-165) — the ONLY authored source of this
# plugin's identity, version, targets, skills and marketplace listing. Every
# provider manifest is generated from it: edit here, then run
#   python3 scripts/render-plugin-package.py --write --plugin <this repo>
# (from stromy-org). .copier-answers.yml is template provenance, never release state.
schema_version: 1
identity:
  name: ogilvy-plugin
  display_name: Ogilvy Dominicana
  version: 0.2.21
  description: Plugin for Ogilvy Dominicana branded deliverables (format skills via stromy-format MCP)
    and Dominican Republic government-data intelligence (do-gov-data MCP)
  author:
    name: stromy-org
  repository: https://github.com/stromy-org/ogilvy-plugin
  license: UNLICENSED
  homepage: https://github.com/stromy-org/ogilvy-plugin
  keywords:
  - ogilvy
  - branded-deliverables
  - dominican-republic
  - government-data
  - public-affairs
targets:
- openai
- codex
- claude
- cursor
- copilot
- vscode
- kiro
- gemini
portable_capabilities:
  dominican-government-research:
    summary: Dominican Republic public-affairs research from official sources
    skills:
    - do-caselaw-watch
    - do-consolidated-law
    - do-gov-data
    - do-guide
    - do-legislative-scan
    - do-policy-landscape
    - do-procurement-watch
    - do-spend-accountability
    - do-transparency-requests
    mcp_servers:
    - do-gov-data
  branded-deliverables:
    summary: Branded documents, decks, charts, diagrams and video rendered server-side in the client's
      brand
    skills:
    - format-chart
    - format-diagram
    - format-docx
    - format-docx-hd
    - format-guide
    - format-html-hd
    - format-html-reveal
    - format-i18n
    - format-mermaid
    - format-motion
    - format-pdf
    - format-pdf-hd
    - format-pptx
    - format-pptx-hd
    - format-prepare-document
    - format-video-hd
    - format-xlsx
    mcp_servers:
    - stromy-format
  plugin-workflows:
    summary: Workflows authored for this plugin and shipped inside it
    skills:
    - getting-started
skills:
  include:
  - do-caselaw-watch
  - do-consolidated-law
  - do-gov-data
  - do-guide
  - do-legislative-scan
  - do-policy-landscape
  - do-procurement-watch
  - do-spend-accountability
  - do-transparency-requests
  - format-chart
  - format-diagram
  - format-docx
  - format-docx-hd
  - format-guide
  - format-html-hd
  - format-html-reveal
  - format-i18n
  - format-mermaid
  - format-motion
  - format-pdf
  - format-pdf-hd
  - format-pptx
  - format-pptx-hd
  - format-prepare-document
  - format-video-hd
  - format-xlsx
  - getting-started
  provider_extras:
  - skill: asset-editor
    providers:
    - claude
    capability: asset-broker-connector
    reason: asset-broker is OAuth-gated and deliberately not declared for Codex (operator decision 2026-08-31);
      no server behind it in a Codex session.
  - skill: asset-feedback
    providers:
    - claude
    capability: asset-broker-connector
    reason: 'Hosted on the OAuth-gated ''asset-broker'' MCP, reachable only as an authorized Claude/Cowork
      workspace connector (Invariant #13); no server behind it elsewhere.'
  - skill: asset-guide
    providers:
    - claude
    capability: asset-broker-connector
    reason: 'Hosted on the OAuth-gated ''asset-broker'' MCP, reachable only as an authorized Claude/Cowork
      workspace connector (Invariant #13); no server behind it elsewhere.'
  - skill: asset-workspace-setup
    providers:
    - claude
    capability: asset-broker-connector
    reason: 'Hosted on the OAuth-gated ''asset-broker'' MCP, reachable only as an authorized Claude/Cowork
      workspace connector (Invariant #13); no server behind it elsewhere.'
  - skill: format-workspace-cowork
    providers:
    - claude
    capability: cowork-workspace
    reason: Co-edits SharePoint workspace artifacts through workspace-scoped tools that exist only in
      a Cowork workspace session.
  - skill: format-workspace-memory
    providers:
    - claude
    capability: cowork-workspace
    reason: Reads and writes the client's SharePoint workspace record through workspace-scoped tools that
      only exist in a Cowork workspace session. Would dead-end in Codex CLI.
  description_overrides:
    format-guide: Product guide for Stromy deliverables -- what to ask for, which format to pick, and
      what each render skill produces. Use when someone is unsure which format skill fits, or is new to
      the deliverable tooling.
    format-prepare-document: Plan a multi-section document before anything is rendered. Use FIRST when
      a branded PPTX, DOCX or PDF needs a section structure; hand the signed-off envelope to a format-*
      render skill. Not a renderer itself.
    format-pptx-hd: Create a NEW branded deck when a client charter exists -- server-rendered PPTX in
      the brand fonts. Use for pitch, investor, executive and ordinary branded decks. Do NOT use to edit
      or analyse an existing deck; that is format-pptx.
    format-pptx: 'Default PPTX skill: unbranded new decks, plus editing, analysis, OOXML, comments and
      speaker notes on any EXISTING deck. Use when a deck already exists or no brand is required.'
    format-pdf-hd: Create a NEW branded PDF from HTML with the full web stack -- reports, one-pagers,
      proposals. Use when the PDF must carry the client brand. Not for reading or editing an existing
      PDF.
    format-pdf: Read, extract, merge, split and manipulate EXISTING PDF files, including text and table
      extraction. Use for PDF surgery, not for authoring a branded document.
    format-docx: Create, read and edit Word .docx files. Use on any mention of a Word doc, .docx, tracked
      changes, or a document that must open natively in Word.
    format-xlsx: Create, edit and analyse spreadsheets -- formulas, formatting, charts, data analysis.
      Use for .xlsx, Excel, or tabular data work.
    format-html-hd: Author a premium, fully self-contained branded HTML slide deck -- one .html file.
      Use when the client wants a web-openable deck rather than PowerPoint.
    format-html-reveal: Create a self-contained reveal.js HTML deck -- one downloadable .html with brand
      fonts and images embedded. Use for a presentable, shareable web deck.
    format-chart: Render brand-aware Plotly data-visualisation charts. Use when a chart is needed on its
      own or to embed in another deliverable.
    format-diagram: Generate branded diagrams -- process flows, architecture views, stakeholder maps,
      org charts, timelines, funnels. Use when a concept needs a picture inside a branded deliverable.
    format-mermaid: Create Mermaid diagrams for Markdown-based docs (GitHub, GitLab, wikis, blogs). Use
      when the diagram must stay as text in Markdown rather than a rendered image.
    format-motion: Author brand-aware motion across HTML surfaces -- animated decks and web pages. Use
      when a deliverable needs movement rather than a static page.
    format-video-hd: Author a premium branded explainer video -- a server-rendered MP4 with animated titles
      and kinetic text. Use when the ask is a video, not a deck.
    format-i18n: Keep a deliverable's language versions from drifting apart. Use when a document exists
      in several languages and you need to know exactly what changed where.
    do-guide: Guia de inicio para investigar el gobierno, el gasto publico y la legislacion de Republica
      Dominicana. Empieza aqui cuando no sepas que preguntar o que fuente oficial usar.
    do-gov-data: Orquestar una investigacion de asuntos publicos dominicanos combinando varias fuentes
      oficiales. Usar cuando la pregunta cruza contrataciones, presupuesto, leyes o jurisprudencia.
    do-procurement-watch: 'Monitorear y analizar contrataciones publicas dominicanas (DGCP): licitaciones
      por institucion o rubro, proveedores y montos. Usar para preguntas de compras del Estado.'
    do-spend-accountability: 'Analizar el gasto publico dominicano: presupuestado frente a ejecutado,
      por institucion y periodo. Usar para preguntas de rendicion de cuentas o ejecucion presupuestaria.'
    do-legislative-scan: 'Rastrear la actividad legislativa dominicana en ambas camaras: estado y cronologia
      de un proyecto de ley, y votaciones nominales. Usar para seguimiento legislativo.'
    do-consolidated-law: Localizar y citar leyes, decretos, resoluciones y reglamentos dominicanos desde
      1844 en la fuente oficial consolidada. Usar cuando se necesite el texto o la cita exacta.
    do-caselaw-watch: 'Investigar jurisprudencia dominicana: sentencias de la Suprema Corte de Justicia
      y del Tribunal Constitucional. Usar para precedentes y criterios judiciales.'
    do-policy-landscape: Construir el panorama completo de un tema de politica publica dominicana cruzando
      todas las fuentes oficiales. Usar para un brief de contexto amplio, no para un dato puntual.
    getting-started: Day-0 setup and orientation for this plugin inside Codex -- confirm the MCP servers
      are reachable, learn how to invoke a skill, and find the right guide. Use when someone is new, asks
      how to get started, or a skill reports its server is unreachable.
providers:
  openai:
    interface:
      displayName: Ogilvy Dominicana
      shortDescription: Branded deliverables and Dominican Republic government data
      longDescription: Produce Ogilvy-branded decks, documents, PDFs, spreadsheets, charts, diagrams and
        video through the hosted stromy-format renderer, and research Dominican Republic public affairs
        — procurement, budget execution, both chambers of Congress, consolidated law from 1844, and SCJ
        and Constitutional Court case law — through the do-gov-data MCP. Brand data ships inside the plugin;
        the government-data skills are in Spanish and start at do-guide.
      developerName: Stromy
      category: Productivity
      capabilities:
      - Read
      - Write
      websiteURL: https://stromy.com.au
      defaultPrompt:
      - Build an Ogilvy-branded deck on this topic.
      - Investiga las licitaciones publicas de esta institucion.
      - Turn this brief into a branded PDF one-pager.
      brandColor: '#EB3F43'
      screenshots: []
marketplace:
  name: ogilvy-marketplace
  repository: https://github.com/stromy-org/ogilvy-marketplace
  description: Plugin marketplace for Ogilvy Dominicana plugins
  entry_description: Plugin for Ogilvy Dominicana branded deliverables (format skills via stromy-format
    MCP) and Dominican Republic government-data intelligence (do-gov-data MCP)
  owner:
    name: stromy-org
  entry_author:
    name: Stromy
